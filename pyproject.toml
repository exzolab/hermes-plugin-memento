[project]
name = "hermes-plugin-memento"
version = "0.1.4"
description = "Memento - Hermes Agent memory plugin"
readme = "README.md"
authors = [{ name = "Daniel Wyatt", email = "dw@exzo.net" }]
requires-python = ">=3.14"
